{% extends "base.html" %}
{% block title %}CleanLink Admin Login{% endblock %}
{% block content %}
<style>
  .login-shell {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    background-color: #eaf5ee;
  }
  /* Wallpaper background with repeating small CleanLink logos */
  .login-shell::before {
    content: "";
    position: absolute;
    inset: -60px;
    background-image: url("/static/cleanlink_logo.png");
    background-repeat: repeat;
    background-size: 56px 56px;
    background-position: 0 0;
    opacity: 0.22;
    transform: rotate(-10deg) scale(1.15);
    pointer-events: none;
    z-index: 1;
  }
  /* Radial vignette overlay to highlight login card */
  .login-shell::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.55) 0%, rgba(215, 240, 226, 0.8) 100%);
    pointer-events: none;
    z-index: 2;
  }
  .login-panel {
    position: relative;
    z-index: 3;
    width: min(420px, 100%);
    padding: 36px 30px;
    background: rgba(255, 255, 255, 0.96) !important;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(23, 138, 90, 0.2) !important;
    border-radius: 16px !important;
    box-shadow:
      0 24px 48px -12px rgba(15, 23, 42, 0.14),
      0 10px 24px -6px rgba(23, 138, 90, 0.1),
      0 0 0 1px rgba(255, 255, 255, 0.9) inset !important;
  }
</style>
<section class="login-shell">
  <form class="login-panel" method="post" action="/login">
    <div class="login-brand-wrapper" style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; text-align: center;">
      <img src="/static/cleanlink_logo.png" alt="CleanLink Logo" width="64" height="64" class="login-logo" style="width: 64px; height: 64px; min-width: 64px; max-width: 64px; min-height: 64px; max-height: 64px; object-fit: contain; display: block; margin: 0 auto; border-radius: 14px;">
      <div class="login-brand-text">
        <h2 style="font-size: 20px; font-weight: 800; margin: 0; color: #0f172a; letter-spacing: -0.3px;">CleanLink</h2>
        <span class="login-portal-tag" style="display: inline-block; font-size: 10px; font-weight: 800; color: #178a5a; letter-spacing: 1px; text-transform: uppercase; background: #e7f6ee; padding: 2px 8px; border-radius: 4px; margin-top: 4px;">Admin Portal</span>
      </div>
    </div>
    <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 6px; text-align: center;">Sign In</h1>
    <p class="muted" style="margin-top: 0; margin-bottom: 20px; font-size: 13px; text-align: center;">Enter your administrator credentials to access the console.</p>
    {% if error %}<div class="alert compact">{{ error }}</div>{% endif %}
    <label style="display: block; margin-bottom: 14px;">
      <span style="display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px;">Email</span>
      <input type="email" name="email" autocomplete="email" placeholder="admin@cleanlink.co.za" required style="width: 100%;">
    </label>
    <label style="display: block; margin-bottom: 20px;">
      <span style="display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px;">Password</span>
      <input type="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required style="width: 100%;">
    </label>
    <button class="button primary" type="submit" style="width: 100%; height: 42px; font-size: 14px;">Sign In to Console</button>
  </form>
</section>
{% endblock %}
